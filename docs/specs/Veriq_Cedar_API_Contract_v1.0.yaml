- Demo operator endpoints MUST be disabled outside synthetic demo configurations.
- GET operations/context may be polled every 1-2 seconds in v1; SSE is optional.
- The initial schema uses single-resource responses for some endpoints and typed arrays for collections; do
  not invent inconsistent envelopes.
