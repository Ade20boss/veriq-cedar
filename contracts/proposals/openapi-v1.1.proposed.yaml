        observed_at: *id008
        kind:
          type: string
          enum:
          - CREATED
          - DEBIT_POSTED
          - SUBMITTED
          - RESPONSE_TIMEOUT
          - STATUS_RESPONSE
          - REVERSAL_POSTED
          - CASE_UPDATE
        summary:
          type: string
        financial_outcome: &id022
          type: string
          enum:
          - UNKNOWN
          - CREDIT_CONFIRMED
