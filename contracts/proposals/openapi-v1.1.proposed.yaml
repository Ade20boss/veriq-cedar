          items:
            $ref: '#/components/schemas/KnowledgeRelationship'
        historical_incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
      required:
      - case_id
      - bank_id
      - financial_outcome
      - question
      - evidence
      - known_relationships
      - historical_incidents
    AIInvestigationOutput:
      type: object
      additionalProperties: false
      properties:
        case_id:
          type: string
        financial_outcome: *id007
        observations:
          type: array
          items:
            $ref: '#/components/schemas/AIObservation'
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/AIHypothesis'
        unknowns:
          type: array
          items:
            type: string
        recommended_checks:
          type: array
          items:
            type: string
        customer_safe_update_draft:
          type: string
      required:
      - case_id
      - financial_outcome
      - observations
      - hypotheses
      - unknowns
      - recommended_checks
      - customer_safe_update_draft
    ReviewInput:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
