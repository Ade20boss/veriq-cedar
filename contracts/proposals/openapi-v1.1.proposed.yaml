                $ref: '#/components/schemas/Error'
        '503':
          description: Required dependency unavailable; bank intake remains independent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIIncidentInput'
      security:
      - internalServiceKey: []
      servers:
      - url: http://localhost:8001
        description: Private AI development
      x-delivery-priority: P0_PROPOSED
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: cedar_demo_session
    internalServiceKey:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
    bankAdapterKey:
      type: apiKey
      in: header
      name: X-Bank-Adapter-Key
      description: Private bank-scoped capability, never browser-exposed. Receiver
        authenticates scope and purpose; shared process may call the same typed port
        directly.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Bank:
      type: object
      additionalProperties: false
      properties:
        bank_id:
          type: string
        name:
          type: string
        is_fictional:
          type: boolean
      required:
      - bank_id
      - name
      - is_fictional
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        display_account_id:
          type: string
        currency:
          type: string
          enum:
          - NGN
        available_balance_kobo:
          type: integer
        owner_display_name:
          type: string
      required:
      - id
      - display_account_id
      - currency
      - available_balance_kobo
      - owner_display_name
    NameEnquiryInput:
      type: object
      additionalProperties: false
      properties:
        bank_id:
          type: string
        account_id:
          type: string
      required:
      - bank_id
      - account_id
    NameEnquiryResult:
      type: object
      additionalProperties: false
      properties:
        bank_id:
          type: string
        account_id:
          type: string
        beneficiary_name:
          type: string
        verified_in_simulation:
          type: boolean
      required:
      - bank_id
      - account_id
      - beneficiary_name
      - verified_in_simulation
    TransferInput:
      type: object
      additionalProperties: false
      properties:
        beneficiary_bank_id:
          type: string
        beneficiary_account_id:
          type: string
        amount_kobo:
          type: integer
          minimum: 1
        narration:
          type: string
      required:
      - beneficiary_bank_id
      - beneficiary_account_id
      - amount_kobo
    Transfer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        reference:
          type: string
        amount_kobo:
          type: integer
        beneficiary_bank_id:
          type: string
        beneficiary_account_id:
          type: string
        processing_stage:
          type: string
          enum:
          - CREATED
          - VALIDATED
          - DEBIT_POSTED
          - SUBMITTED
          - ACKNOWLEDGED
          - RESPONSE_TIMEOUT
          - STATUS_QUERIED
          - COMPLETED
        financial_outcome: &id007
          type: string
          enum:
          - UNKNOWN
          - CREDIT_CONFIRMED
          - FAILURE_CONFIRMED
          - REVERSAL_POSTED
        last_evidence_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - reference
      - amount_kobo
      - beneficiary_bank_id
      - beneficiary_account_id
      - processing_stage
      - financial_outcome
      - created_at
      - updated_at
    ComplaintInput:
      type: object
      additionalProperties: false
      properties:
        transfer_id:
          type: string
        description:
          type: string
          minLength: 5
          maxLength: 2000
      required:
      - transfer_id
      - description
    Complaint:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        reference:
          type: string
        transfer_id:
          type: string
        customer_report:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - WAITING_FOR_EVIDENCE
          - RESOLVED
        customer_safe_updates:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - reference
      - transfer_id
      - customer_report
      - status
      - customer_safe_updates
      - created_at
    SourceListItem:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
        filename:
          type: string
        source_kind:
          type: string
        status:
          type: string
          enum:
          - UPLOADED
          - PARSED
          - STAGED
          - ACCEPTED
          - REJECTED
          - FAILED
        accepted_claims:
          type: integer
        flagged_claims:
          type: integer
        checksum_sha256:
          type: string
      required:
      - source_id
      - filename
      - source_kind
      - status
      - accepted_claims
      - flagged_claims
    SourceRegistration:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
        status:
          type: string
        job_id:
          type: string
      required:
      - source_id
      - status
      - job_id
    ContextSummary:
      type: object
      additionalProperties: false
      properties:
        bank_id:
          type: string
        context_version:
          type: integer
        entity_counts:
          type: object
          additionalProperties:
            type: integer
        relationship_counts:
          type: object
          additionalProperties:
            type: integer
        source_count:
          type: integer
        candidate_count:
          type: integer
        verified_count:
          type: integer
        updated_at:
          type: string
          format: date-time
      required:
      - bank_id
      - context_version
      - entity_counts
      - relationship_counts
      - source_count
      - candidate_count
      - verified_count
      - updated_at
    KnowledgeRelationship:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        bank_id:
          type: string
        from_entity_id:
          type: string
        to_entity_id:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - CANDIDATE
          - DOCUMENTED
          - OBSERVED
          - VERIFIED
          - REJECTED
        evidence_ids:
          type: array
          items:
            type: string
        source_id:
          type: string
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - bank_id
      - from_entity_id
      - to_entity_id
      - type
      - status
      - evidence_ids
      - source_id
    RouteHealth:
      type: object
      additionalProperties: false
      properties:
        route_id:
          type: string
        service_id:
          type: string
        window_attempts:
          type: integer
        window_timeouts:
          type: integer
        baseline_attempts:
          type: integer
        baseline_timeouts:
          type: integer
        status:
          type: string
          enum:
          - NORMAL
          - DEGRADED
          - INSUFFICIENT_DATA
      required:
      - route_id
      - window_attempts
      - window_timeouts
      - baseline_attempts
      - baseline_timeouts
      - status
    Incident:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        bank_id:
          type: string
        route_id:
          type: string
        status:
          type: string
          enum:
          - SUSPECTED
          - CONFIRMED
          - REJECTED
          - CLOSED
        first_observed_at:
          type: string
          format: date-time
        finding_summary:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        case_ids:
          type: array
          items:
            type: string
      required:
      - id
      - bank_id
      - route_id
      - status
      - first_observed_at
      - finding_summary
      - evidence_ids
      - case_ids
    EvidenceRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        source_system:
          type: string
        kind:
          type: string
        observed_at:
          type: string
          format: date-time
        occurred_at:
          type: string
          format: date-time
        citation:
          type: string
        verified_for_purpose:
          type: boolean
        data:
          type: object
          additionalProperties: true
      required:
      - id
      - source_system
      - kind
      - observed_at
      - occurred_at
      - citation
      - verified_for_purpose
      - data
    Investigation:
      type: object
      additionalProperties: false
      properties:
        case_id:
          type: string
        status:
          type: string
          enum:
          - REQUESTED
          - EVIDENCE_READY
          - AI_PENDING
          - FINDINGS_READY
          - EVIDENCE_READY_AI_UNAVAILABLE
          - REVIEWED
          - RESOLVED
        financial_outcome: *id007
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRecord'
        incident_ids:
          type: array
          items:
            type: string
        ai_result:
          oneOf:
          - $ref: '#/components/schemas/AIInvestigationOutput'
          - type: 'null'
      required:
      - case_id
      - status
      - financial_outcome
      - evidence
      - incident_ids
      - ai_result
    AIClaim:
      type: object
      additionalProperties: false
      properties:
        claim_id:
          type: string
        subject:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
            external_id:
              type: string
          required:
          - type
          - external_id
        predicate:
          type: string
        object:
          type: string
        source_locator:
          type: string
        quoted_evidence:
          type: string
        classification:
          type: string
          enum:
          - SOURCE_CLAIM
          - CANDIDATE_RELATIONSHIP
        needs_review:
          type: boolean
      required:
      - claim_id
      - subject
      - predicate
      - object
      - source_locator
      - quoted_evidence
      - classification
      - needs_review
    AIExtractInput:
      type: object
      additionalProperties: false
      properties:
        bank_id:
          type: string
        source_id:
          type: string
        source_kind:
          type: string
        chunks:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              chunk_id:
                type: string
              text:
                type: string
            required:
            - chunk_id
            - text
