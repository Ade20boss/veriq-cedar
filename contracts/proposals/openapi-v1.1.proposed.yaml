          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
      - source_id
      - claims
      - unresolved_mentions
      - warnings
    AIObservation:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
      required:
      - text
      - evidence_ids
    AIHypothesis:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        alternatives:
          type: array
          items:
            type: string
      required:
      - text
      - evidence_ids
      - alternatives
