          - CONFIRM
          - REJECT
          - REQUEST_MORE_EVIDENCE
        reason:
          type: string
          minLength: 3
        evidence_ids:
          type: array
          items:
            type: string
      required:
      - decision
      - reason
      - evidence_ids
    ActionAccepted:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
      required:
      - id
      - status
    DemoAction:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        run_id:
          type: string
        details:
