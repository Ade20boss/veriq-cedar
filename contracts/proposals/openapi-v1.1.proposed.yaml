        actor_kind:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - OPERATOR
        display_name:
          type: string
        bank_id: *id001
        roles:
          type: array
          items:
            type: string
            enum:
            - CUSTOMER
            - SUPPORT
            - ANALYST
            - SUPERVISOR
            - INVESTIGATOR
            - DEMO_OPERATOR
        department_id:
          anyOf:
          - *id001
          - type: 'null'
        permissions:
          type: array
          items:
            type: string
            enum:
            - cedar.customer.read
            - cedar.transactions.read
            - cedar.cases.read
            - cedar.cases.create
            - cedar.cases.update
            - cedar.cases.assign
            - cedar.communications.publish
            - veriq.read
            - veriq.review
            - veriq.verify
            - demo.operate
        expires_at: &id008
          type: string
          format: date-time
        csrf_token:
          type: string
          minLength: 1
      required:
      - actor_id
      - actor_kind
      - display_name
      - bank_id
      - roles
      - department_id
      - permissions
      - expires_at
      - csrf_token
      description: 'Return Cache-Control: no-store. HttpOnly session cookie is set
        by server; csrf_token is not a credential replacement.'
    SessionClosed:
